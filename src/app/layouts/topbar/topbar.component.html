<header
	class="relative z-50 border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)]/95 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-secondary)]/80"
>
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between overflow-visible px-4 py-3 sm:px-6"
	>
		<a
			[translate]="{ ariaLabel: 'Go to homepage' }"
			class="inline-flex items-center gap-3 theme-focus rounded-lg"
			routerLink="/"
		>
			<div
				class="flex h-10 w-10 items-center justify-center rounded-[var(--radius)] bg-[var(--c-primary)] text-white shadow-[var(--shadow-sm)]"
			>
				<span class="material-symbols-outlined text-xl">car_repair</span>
			</div>
			<div class="hidden sm:block">
				<p class="text-sm font-bold tracking-[0.08em] text-[var(--c-text-strong)] leading-tight">
					{{ company().name || 'Авто Сервіс' }}
				</p>
				<p class="text-xs text-[var(--c-text-muted)] leading-tight">Автосервіс</p>
			</div>
		</a>

		<nav class="hidden md:flex items-center gap-1">
			<a
				href="#services"
				class="theme-focus px-3 py-2 rounded-[var(--radius)] text-sm font-medium text-[var(--c-text)] hover:text-[var(--c-text-strong)] hover:bg-[var(--c-bg-primary)] theme-interactive"
			>
				Послуги
			</a>
			<a
				href="#about"
				class="theme-focus px-3 py-2 rounded-[var(--radius)] text-sm font-medium text-[var(--c-text)] hover:text-[var(--c-text-strong)] hover:bg-[var(--c-bg-primary)] theme-interactive"
			>
				Про нас
			</a>
			<a
				href="#contact"
				class="theme-focus px-3 py-2 rounded-[var(--radius)] text-sm font-medium text-[var(--c-text)] hover:text-[var(--c-text-strong)] hover:bg-[var(--c-bg-primary)] theme-interactive"
			>
				Контакти
			</a>
		</nav>

		<div class="flex items-center gap-2">

			<button
				type="button"
				class="theme-focus theme-interactive flex h-9 w-9 items-center justify-center rounded-[var(--radius)] border border-[var(--c-border)] bg-[var(--c-bg-primary)] text-[var(--c-text-strong)] hover:bg-[var(--c-bg-secondary)] hover:border-[var(--c-primary)]"
				[attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
				(click)="toggleMode()"
			>
				<span class="material-symbols-outlined text-base">{{ toggleIcon() }}</span>
			</button>

			<a
				href="tel:+380000000000"
				class="theme-focus theme-interactive hidden sm:inline-flex items-center gap-1.5 rounded-[var(--radius-btn)] bg-[var(--c-primary)] px-4 py-2 text-sm font-semibold text-white hover:bg-[var(--c-primary-hover)] shadow-[var(--shadow-sm)]"
			>
				<span class="material-symbols-outlined text-base">call</span>
				Зателефонувати
			</a>
		</div>
	</div>
</header>
