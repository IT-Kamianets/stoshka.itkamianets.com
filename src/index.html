<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<title>Авто Сервіс</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const storedMode = localStorage.getItem('app-mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>
		<meta
			name="description"
			content="Авто Сервіс — комплексний технічний сервіс автомобілів у Кам'янці-Подільському. Діагностика, ремонт, ТО, шиномонтаж та кузовні роботи."
		/>
		<meta name="author" content="Авто Сервіс" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
		<meta property="og:title" content="Авто Сервіс" />
		<meta
			property="og:description"
			content="Комплексний технічний сервіс автомобілів. Діагностика, ремонт, ТО та шиномонтаж."
		/>
		<meta property="og:type" content="website" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/x-icon" href="favicon.png" />
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
